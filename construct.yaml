schema_version: 3
name: K-Hole
slug: k-hole
version: 1.3.0
description: "Deep research engine with web search and source tracking. Two modes: /dig for interactive exploration (go deep on one topic) and /forge for systematic coverage across multiple domains. Produces structured research with citations, not summaries."
short_description: "Deep research + source synthesis"
domain:
  - analytics
author: 0xHoneyJar
license: MIT
visibility: public
skills:
  # /dig — THE entry point. The four primitives (breadth · depth ·
  # pulling-threads · resonance) are flags on scripts/dig-search.ts; the
  # surface contract is schemas/dig-surface.schema.json.
  - slug: dig
    path: skills/dig
  # /forge — the batch research pipeline (breadth-mapping at scale). The
  # dig↔forge transition is P2/3 roadmap (see issue #21 enrichment).
  - slug: orchestrator
    path: skills/orchestrator
  - slug: domain-discovery
    path: skills/domain-discovery
  - slug: config-generator
    path: skills/config-generator
  - slug: deep-research
    path: skills/deep-research
  # Multimodal research extensions — grounded search seeded by image input.
  - slug: visual-dig
    path: skills/visual-dig
  - slug: visual-review
    path: skills/visual-review

commands:
  - name: dig
    path: commands/dig.md
  - name: forge
    path: commands/forge.md
  - name: discover
    path: commands/discover.md
  - name: config
    path: commands/config.md
  - name: research
    path: commands/research.md

repository:
  url: https://github.com/0xHoneyJar/construct-k-hole.git
  homepage: https://constructs.network/constructs/k-hole
streams:
  reads: [Intent, Operator-Model]
  writes: [Signal, Artifact]
events:
  emits:
    - type: forge.k-hole.descent_started
      description: Emitted when a k-hole research session begins
      data_schema:
        domain: string
        mode: string
    - type: forge.k-hole.thread_pulled
      description: Emitted when user follows a pull thread in /dig
      data_schema:
        thread_id: string
        depth: number
        query: string
    - type: forge.k-hole.emergence_complete
      description: Emitted when final synthesis is complete and user surfaces
      data_schema:
        domain: string
        topic_count: number
        output_path: string
    - type: forge.k-hole.resonance_detected
      description: Emitted when a finding matches the active resonance profile
      data_schema:
        topic: string
        anchor: string
        excerpt: string
capabilities:
  model_tier: opus
  danger_level: moderate
  effort_hint: large
  downgrade_allowed: false
  execution_hint: sequential
  requires:
    tool_calling: true
    thinking_traces: true
    vision: false
    # Phase 2 (#21): grounded_search is the actual dependency (was undeclared).
    # Served by the two-lane substrate — cheval (internal models) + MCP (Exa/Executor).
    grounded_search: true
type: skill-pack
composition_paths:
  writes:
    - grimoires/resonance/
    - grimoires/k-hole/
identity:
  persona: identity/persona.yaml
  stamets: identity/STAMETS.md
  voices:
    - identity/voices/lilly.md
    - identity/voices/carhart.md
    - identity/voices/shulgin.md
    - identity/voices/warburg.md
    - identity/voices/nelson.md
    - identity/voices/ulbricht.md
    - identity/voices/nakamoto.md
  expertise: identity/expertise.yaml
hooks:
  post_install: scripts/install.sh
quick_start:
  command: /dig
  description: Give it a thread worth pulling -- it goes deep
