# Loa Framework Configuration — construct-k-hole
persistence_mode: standard
integrity_enforcement: strict
drift_resolution: code
disabled_agents: []
memory:
  notes_file: grimoires/loa/NOTES.md
  trajectory_dir: grimoires/loa/a2a/trajectory
  trajectory_retention_days: 30
  auto_restore: true
edd:
  enabled: true
  min_test_scenarios: 3
  trajectory_audit: true
  require_citations: true
compaction:
  enabled: true
  threshold: 5
integrations:
  - github

# =============================================================================
# Simstim — HITL Accelerated Development Workflow
# =============================================================================
simstim:
  enabled: true
  bridgebuilder_design_review: false   # Phase 3.5 — opt-in
  flatline:
    beads_loop: false                  # Phase 6.5 — opt-in

# =============================================================================
# Flatline Protocol — Multi-model adversarial review (HEADLESS-DIRECT)
# =============================================================================
# Ported verbatim from the bonfire config after it was proven end-to-end:
# 6/6 clean calls, real 3-model consensus, $0 (subscription auth).
flatline_protocol:
  enabled: true
  models:
    # HEADLESS-DIRECT routing. These forward-compat names match VALID_MODEL_PATTERNS
    # in flatline-orchestrator (so validate_model passes) but are NOT registered in
    # generated-model-maps.sh — the model-adapter shim falls through as-is, and cheval
    # resolves them via hounfour.aliases below DIRECTLY to a *-headless adapter. No API
    # call is ever constructed → quota'd / zero-credit API keys are never touched.
    #
    # Why not bare registered aliases (opus / gpt-5.3-codex)? Those route API-FIRST;
    # cheval's within-company fallback_chain only walks to headless on *retryable*
    # errors, and `insufficient_quota` / `credit balance too low` are non-retryable —
    # so they hard-fail instead of falling through to the subscription CLI.
    #
    # KNOWN COSMETIC ISSUE: flatline-readiness.sh::is_valid_alias reads
    # .claude/defaults/model-config.yaml aliases ONLY, not hounfour.aliases — so it
    # reports DEGRADED for these names. False-positive: the orchestrator path
    # (validate_model → shim → cheval → hounfour.aliases → headless) works.
    # readiness is informational / non-blocking by its own design.
    primary: claude-opus-4-8       # hounfour.aliases → claude-headless:claude-opus-4-7
    secondary: gpt-5.4-codex       # hounfour.aliases → codex-headless:gpt-5.5
  max_iterations: 5
  knowledge:
    notebooklm:
      enabled: false

# =============================================================================
# Hounfour — model routing (cheval headless adapters)
# =============================================================================
hounfour:
  # Headless-direct forward-compat name; hounfour.aliases resolves it →
  # gemini-headless:gemini-3.1-pro-preview.
  flatline_tertiary_model: gemini-3.0-pro
  # Route flatline through cheval (model-invoke → cheval.py) so the
  # subscription-auth headless adapters (codex/claude/gemini) handle reviews.
  flatline_routing: true
  # Headless-registered models per provider:
  #   codex-headless: gpt-5.5
  #   gemini-headless: gemini-3.1-pro-preview, gemini-3-flash-preview
  #   claude-headless: claude-opus-4-7, claude-sonnet-4-6
  aliases:
    reviewer: codex-headless:gpt-5.5
    reasoning: codex-headless:gpt-5.5
    deep-thinker: gemini-headless:gemini-3.1-pro-preview
    # Forward-compat → headless subscription bridges. LOAD-BEARING: these are the
    # resolution targets for flatline_protocol.models above. Each maps a regex-valid
    # forward-compat name directly onto a *-headless adapter so cheval never builds
    # an API request.
    claude-opus-4-8: claude-headless:claude-opus-4-7
    gpt-5.4-codex: codex-headless:gpt-5.5
    gemini-3.0-pro: gemini-headless:gemini-3.1-pro-preview
  # Provider registry — headless adapter definitions. Subscription-auth, $0/token.
  # Auth setup:
  #   codex-headless    → `codex login`            (ChatGPT subscription)
  #   claude-headless   → `claude /login`          (Claude Max/Pro/Team)
  #   gemini-headless   → `gemini` interactive run (personal Google / Advanced)
  providers:
    codex-headless:
      type: codex-headless
      read_timeout: 600.0
      models:
        gpt-5.5:
          capabilities: [chat, code]
          context_window: 400000
          token_param: max_completion_tokens
          pricing:
            input_per_mtok: 0
            output_per_mtok: 0
          extra:
            reasoning_effort: high
    claude-headless:
      type: claude-headless
      read_timeout: 600.0
      models:
        claude-opus-4-7:
          capabilities: [chat, tools, function_calling, thinking_traces]
          context_window: 200000
          pricing:
            input_per_mtok: 0
            output_per_mtok: 0
          extra:
            effort: high
        claude-sonnet-4-6:
          capabilities: [chat, tools, function_calling]
          context_window: 200000
          pricing:
            input_per_mtok: 0
            output_per_mtok: 0
    gemini-headless:
      type: gemini-headless
      read_timeout: 600.0
      models:
        gemini-3.1-pro-preview:
          capabilities: [chat, thinking_traces]
          context_window: 1048576
          pricing:
            input_per_mtok: 0
            output_per_mtok: 0
        gemini-3-flash-preview:
          capabilities: [chat]
          context_window: 1048576
          pricing:
            input_per_mtok: 0
            output_per_mtok: 0
